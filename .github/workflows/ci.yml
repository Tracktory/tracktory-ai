name: CI (FastAPI)

on:
  pull_request:
    branches: ["develop", "main"] # 특정 브랜치에 PR 이벤트 발생 시 CI 실행
  push:
    branches: ["develop", "main"] # 특정 브랜치로 직접 push될 때도 CI 실행
  workflow_dispatch: # Actions 탭에서 수동 실행 버튼 제공

# 같은 브랜치에서 중복 실행되면 이전 빌드 취소(리소스 절약/레이스 방지)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # 코드 읽기 권한

# 전역 환경변수
env:
  PYTHON_VERSION: "3.13"
  IMAGE: ${{ secrets.DOCKER_USERNAME }}/tracktory-ai # Docker Hub 이미지명(소문자 필수)

jobs:
  build: # 1) 게이트 Job — PR과 push 모두 실행
    name: Build
    runs-on: ubuntu-latest

    # 참고: FastAPI 는 MySQL 미사용(sqlite 체크포인트 + RAGFlow 네트워크 호출).
    # 단위 테스트는 `-m "not integration"` 로 외부 I/O 를 타지 않으므로 사이드카 불필요.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true # ~/.cache/uv 캐시로 의존성 해결 가속

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Lock check # uv.lock 무결성 (pyproject 와 동기화 확인)
        run: uv lock --check

      - name: Ruff format # 포매팅 게이트
        run: uv run ruff format --check .

      - name: Ruff lint # 린트 게이트
        run: uv run ruff check .

      - name: Type check # mypy 게이트
        run: uv run mypy src

      - name: Test # 단위 테스트 게이트 (외부 I/O integration 은 제외)
        run: uv run pytest -m "not integration"

  docker-push: # 2) Docker 이미지 빌드/푸시 Job — PR에서는 실행 X
    name: Docker Build & Push
    # 조건: PR 이벤트가 아니고 && 대상 브랜치가 `main` or `develop`일 때만 푸시
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    needs: build # 게이트 Job 성공 후에만 실행
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: . # 소스에서 직접 빌드 (JAR 아티팩트 단계 없음 — uv sync 가 Dockerfile 안에서 처리)
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref == 'refs/heads/main' && 'latest' || 'dev' }}
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
