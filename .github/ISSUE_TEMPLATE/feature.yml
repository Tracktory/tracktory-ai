name: ✨ 기능 추가
description: 새로운 기능을 구현할 때 사용합니다.
title: "✨ Feat: "
labels: ["feat"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 📌 작업 목적
      placeholder: 왜 이 기능이 필요한가요? 한 줄로 요약해주세요.
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: ✅ 완료 조건
      value: |
        - [ ]
      placeholder: |
        - [ ] LangGraph 노드 구현 (예: RetrieveTracksNode)
        - [ ] Pydantic 입출력 스키마 정의
        - [ ] 프롬프트 템플릿 작성 (src/tracktory/prompts/)
        - [ ] 단위 테스트 추가 (tests/unit/)
    validations:
      required: true

  - type: input
    id: related
    attributes:
      label: 🔗 관련 정보
      placeholder: 기능명세서 ID, 관련 이슈 번호 등
    validations:
      required: false
