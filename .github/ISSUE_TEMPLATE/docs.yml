name: 📄 문서 작업
description: 문서 생성 또는 갱신이 필요할 때 사용합니다.
title: "📄 Docs: "
labels: ["docs"]
body:
  - type: textarea
    id: doc-target
    attributes:
      label: 📌 작업 목적
      placeholder: ex) README.md 업데이트, CONTRIBUTING 규약 추가, CLAUDE.md 아키텍처 철학 갱신
    validations:
      required: true

  - type: textarea
    id: task
    attributes:
      label: ✅ 완료 조건
      value: |
        - [ ]
      placeholder: |
        - [ ] 기존 구조 설명 보완
        - [ ] 사용 예시 추가
    validations:
      required: true
