[project]
name = "tracktory"
version = "0.1.0"
description = "AI-powered career recommendation system - data crawling, agent, and API"
license = "MIT"
authors = [{ name = "Tracktory Team" }]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "fastapi>=0.136.1",
    "langchain>=1.2.16",
    "langchain-openai>=1.2.1",
    "langgraph>=1.1.10",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "numpy>=2.0",
    "pandas>=2.0.0",
    "playwright>=1.58.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "ragflow-sdk>=0.25.6",
    "requests>=2.32.5",
    "uvicorn>=0.46.0",
]

[project.urls]
Repository = "https://github.com/Tracktory/tracktory-ai"
Issues = "https://github.com/Tracktory/tracktory-ai/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracktory"]

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "pre-commit>=4.6.0",
    "pytest>=8.4",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.14",
    "ruff>=0.15.10",
    "types-pyyaml>=6.0.12.20260408",
]

# ---------------------------------------------------------------------------
# Ruff — formatter + linter (black/isort/flake8 replacement)
# Docs: https://docs.astral.sh/ruff/
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]
extend-exclude = ["data", "logs", ".venv"]

[tool.ruff.lint]
# 활성화할 규칙 카테고리
#   E, W : pycodestyle (PEP 8)
#   F    : pyflakes (미사용 import/변수 등)
#   I    : isort (import 정렬)
#   N    : pep8-naming (snake_case / PascalCase 강제)
#   UP   : pyupgrade (구식 문법 업그레이드)
#   B    : flake8-bugbear (흔한 버그 패턴)
#   SIM  : flake8-simplify (불필요한 복잡도)
#   RUF  : ruff 전용 규칙
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",  # line too long — formatter가 처리
    "B008",  # function call in default argument — FastAPI Depends 패턴 허용
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["N802"]  # 테스트 함수명은 자유롭게 (test_XxxYyy 허용)

[tool.ruff.lint.isort]
known-first-party = ["tracktory"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true  # docstring 안 코드 블록도 포맷

# ---------------------------------------------------------------------------
# mypy — static type checker
# Docs: https://mypy.readthedocs.io/
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
files = ["src"]
strict = false  # 초기에는 느슨하게, 점진적으로 강화

# 공개 함수에는 타입 힌트 필수
disallow_untyped_defs = true
disallow_incomplete_defs = true

# 암묵적 Optional 금지 (X = None 기본값이면 명시적으로 X | None 선언)
no_implicit_optional = true

# 안전망
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true

# 외부 라이브러리 타입 스텁 없을 때 경고만
ignore_missing_imports = true

# LangGraph/LangChain은 타입 커버리지 느슨 → 모듈별 제외
[[tool.mypy.overrides]]
module = ["langgraph.*", "langchain.*", "langchain_core.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
markers = [
    "integration: 외부 I/O 또는 다단계 노드 통합 테스트 (CI 기본 실행 제외)",
    "e2e: 실제 외부 시스템 (RAGFlow 등) 을 호출하는 smoke test. RAGFLOW_API_KEY 같은 환경변수가 설정된 환경에서만 수동 실행 (CI 기본 실행 제외)",
]
