# 흥미 개발 분야(dev_interest) → 검색 키워드 확장 사전
#
# 온보딩에서 받는 흥미 개발 분야 값("앱", "데이터" 등)은 추상적이라, 채용공고
# 기반 직무 검색 인덱스의 구체적 어휘(모바일 개발자, 데이터 엔지니어 …)와 격차가
# 커서 프로필 ↔ 직무 유사도가 낮게 잡힌다. 그 결과 실제로 적합한 직무가 있어도
# 유사도 컷 미달로 카테고리 fallback 으로 빠진다.
#
# 이 사전은 각 추상 값을 직무 인덱스 어휘에 가까운 키워드 묶음으로 확장해 프로필
# 직렬화 문장에 주입한다. 프로필 직렬화는 동일 입력이 항상 동일 출력이어야 하므로
# (임베딩 비교 실험의 통제 조건) 런타임 LLM 호출 대신 정적 사전으로 확장한다.
# 확장 키워드 자체는 오프라인에서 한 번 정하고 그대로 고정한다.
#
# keywords 의 각 값은 직렬화 시 원본 값을 대체한다. 확장은 검색 질의에만 영향을
# 주며, 직무 인덱스 측 임베딩은 바뀌지 않으므로 인덱스 재생성은 불필요하다.
# 사전을 수정하면 version 을 갱신한다.
#
# 검증: 대표 프로필(IT/인터넷 · 성장성 · 대기업)에 단일 흥미 분야를 넣어 실제 직무
# 검색을 돌린 유사도(top job 일치 기준).
#   앱     0.28  → 모바일 개발자        ✅
#   웹     0.32  → 프론트엔드 개발자      ✅
#   데이터   0.33  → 데이터 엔지니어       ✅
#   AI     0.31  → 머신러닝 엔지니어      ✅
#   게임    0.14  → (인덱스 직무 희박)     fallback
#   보안    0.12  → (인덱스 직무 희박)     fallback
# 게임·보안은 현재 직무 인덱스에 해당 직무 청크가 희박해 컷 미달로 fallback 된다.
# 채용공고 수집 범위가 넓어지면 같은 키워드로 자동 복구되도록 항목은 유지한다.
version: "0.1"

keywords:
  앱: "모바일 개발(안드로이드, iOS, 모바일 앱)"
  웹: "웹 프론트엔드 개발(웹 개발, React, 프론트엔드)"
  데이터: "데이터 엔지니어링(데이터 파이프라인, ETL, 데이터 분석, SQL)"
  AI: "AI(머신러닝, 딥러닝, 데이터 분석)"
  게임: "게임 개발(게임 클라이언트, 게임 서버, Unity)"
  보안: "정보보안(보안 엔지니어, 시스템 보안, 취약점 분석)"
