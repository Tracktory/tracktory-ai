# 학습 로드맵 외부화 설정 (학기 용량 + 졸업 요건 + 학년별 학점 범위)
#
# 본 파일은 한성대 일반 학사 제도를 기반으로 한 hard constraint 만 담는다.
# 시너지 가중치 ablation (synergy.yaml) 과 변경 이유가 독립적이라 별도 파일로
# 운영한다.

# ── 학기 용량 정책 ──────────────────────────────────────────────────
# default  : 학기당 기본 최대 학점 (한성대 일반 학기 제도)
# high_gpa : 직전 학기 평점 우수 기준선 이상일 때 허용 학점 (현재는 보존만)
#
# 현재 사용자 입력에 직전 학기 평점 필드가 없어 노드 본체는 default 만 사용한다.
capacity:
  max_credits_per_semester_default: 18
  max_credits_per_semester_high_gpa: 21

# ── 졸업 요건 ────────────────────────────────────────────────────────
# total_credits_two_tracks : 1 트랙 + 2 트랙 합산 전공 필수 학점.
#   추천 분기 hint 로 보존. 분산 알고리즘의 종료 조건으로는 미사용.
# total_credits_major      : 전공 (필수 + 선택) 합산 졸업 학점. 학습 로드맵
#   분산은 누적 추천 학점이 이 값에 도달하면 stream 을 종료하고 해당 학기에
#   도달 마커를 설정한다. 1 트랙 39 + 2 트랙 39 = 78 학점.
graduation:
  total_credits_two_tracks: 30
  total_credits_major: 78

# ── 학년별 전공 학점 범위 ───────────────────────────────────────────
# 학사 운영의 학년 단위 권장 학점 분포. ``max`` 는 분산 알고리즘의 hard
# ceiling 이고 ``min`` 은 사용자 안내 (학년 그룹 헤더의 "권장 N~M 학점") 에서만
# 노출한다. MVP 단순화 — 학년 단위 범위만 강제하고 학기 단위 floor 는
# 미적용한다. 학사 정책 변경 시 본 값만 갱신하면 코드 수정 없이 반영된다.
grade_credits_range:
  1: { min: 8,  max: 16 }
  2: { min: 24, max: 36 }
  3: { min: 24, max: 36 }
  4: { min: 0,  max: 99 }  # 졸업 잔여 흡수 (1~3 학년에서 들지 못한 학점 마무리)
