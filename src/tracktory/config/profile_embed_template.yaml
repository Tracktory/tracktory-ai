# 프로필 임베딩 Template 직렬화 규칙
#
# 카테고리형 프로필 입력을 결정론적 키워드 나열로 변환한다.
# LLM 미사용 — 동일 입력은 항상 동일 출력. 파이프라인 비교 실험의 통제 조건이 되므로
# 이 파일을 수정하면 직무 검색 질의의 토큰 분포가 달라진다. 변경 시 version 갱신 필수.
#
# 키워드형을 쓰는 이유: 직무 검색 인덱스(채용공고)의 어휘는 키워드 중심이라, 관형구로
# 풀어쓴 문장형 질의("…분야에 관심이 많은 학생입니다")는 질의-문서 유사도가 낮게
# 잡힌다. 같은 입력을 키워드 나열로 직렬화하면 인덱스 어휘와의 표면 정합이 올라가
# 유사도가 높아진다. (질의 신호만 바꾸는 것이며 인덱스 측 임베딩은 불변.)
version: "0.3"

# 절 단위 직렬화 규칙.
#   - 각 절은 정규화 프로필의 한 필드 값을 그대로 키워드로 노출한다 (관형구 어미 없음).
#   - 필드 값이 비어 있으면 해당 절을 건너뛴다 (선택 입력의 누락이 빈 구분자를
#     남기지 않게).
#   - 절은 선언 순서대로 clause_separator 로 이어 붙인다 (suffix 없음).
# 사용 placeholder: 각 template 안의 {value} 는 해당 필드 값 리스트를
# value_separator 로 이어 붙인 문자열로 치환된다.
clauses:
  - field: interests
    template: "{value}"
  - field: dev_interests
    template: "{value}"
  - field: work_values
    template: "{value}"
  - field: company_types
    template: "{value}"
  - field: ncs_studied
    template: "{value}"

clause_separator: ", "
# 한 절 안의 여러 값은 절 구분자(", ")와 다른 기호로 이어 붙여, 값 경계와 절
# 경계가 시각적으로 섞이지 않게 한다.
value_separator: " · "
suffix: ""
