# 채용공고 카테고리 → 직무 타입 매핑 (RAGFlow 직무 검색 어댑터)
#
# RagflowJobSearchClient 가 검색된 공고의 content `카테고리:` 값을 직무 타입
# id/name 으로 변환할 때 사용한다. 공고 번호(source_id) 대신 카테고리 기반
# 식별자를 부여하여 fallback `category_to_jobs.yaml` 과 동일한 granularity
# (직무 타입)로 맞춘다.
#
# 키       : 공고 카테고리 (common/categories.py 의 IT_JOB_CATEGORIES 와 동일)
# job_id   : 직무 타입 슬러그 (config/category_to_jobs.yaml 의 job_id 와 정합 필수)
# job_name : 사용자 표시명
#
# 스키마:
#   <카테고리>: { job_id: <슬러그>, job_name: <표시명> }

백엔드: { job_id: backend_developer, job_name: 백엔드 개발자 }
