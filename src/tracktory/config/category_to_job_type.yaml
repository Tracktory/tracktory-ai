# 채용공고 카테고리 → 직무 카탈로그 표준 코드 매핑 (RAGFlow 직무 검색 어댑터)
#
# RagflowJobSearchClient 가 검색된 공고의 content `카테고리:` 값을 직무 식별자/
# 표시명으로 변환할 때 사용한다. 공고 번호(source_id) 대신 카테고리 기반 식별자를
# 부여하되, 그 식별자를 직무 카탈로그 표준 코드(job_tech_stacks.json 의
# category_id)로 맞춘다. 정상 추천 경로와 fallback(category_to_jobs.yaml) 경로가
# 동일한 표준 코드 어휘를 공유하므로, 메인 백엔드가 별칭 매핑 없이 직무를 조인할
# 수 있다.
#
# 표준 코드가 없는 공고 카테고리(풀스택·QA·임베디드·블록체인·DBA)는 매핑에서
# 제외하여, 카탈로그 밖 식별자가 추천 결과로 새지 않도록 한다 — 미매핑 카테고리
# 청크는 RagflowJobSearchClient 가 스킵한다. 데이터사이언스는 별도 표준 코드가
# 없어 데이터 분석가(DA)로 흡수하며, 이는 채용공고 정규화(normalize_wanted)의
# 직무 코드 폴딩과 동일하다.
#
# 키          : 공고 카테고리 (common/categories.py 의 IT_JOB_CATEGORIES 와 동일)
# job_id      : 직무 카탈로그 표준 코드 (job_tech_stacks.json 의 category_id 와 정합)
# job_name    : 사용자 표시명 (카탈로그 category_name_ko 와 정합)
# tech_stacks         : 카테고리별 채용공고 기술스택 빈도 상위 N개 (extract_tech_keywords 정규화).
#                       RagflowJobSearchClient 가 직무 후보의 대표 tech_stacks 로 쓰며, 매칭된
#                       공고 기술 중 이 목록에 없는 것만 competency_tags 로 분리한다.
# competency_fallback : tech_stacks 다음 순위의 보충 기술. 매칭 공고가 실제 언급한
#                       competency_tags 가 너무 적을 때 노드가 채워 넣는다.
#
# 둘 다 scripts/aggregate_category_tech_stacks.py 가 metadata.json 으로 자동 생성하며,
# 공고 수가 적은 카테고리(게임·보안)는 스크립트 안에서 수동 큐레이션한다.
#
# 스키마:
#   <카테고리>: { job_id: <표준 코드>, job_name: <표시명>,
#               tech_stacks: [<기술>, ...], competency_fallback: [<기술>, ...] }

